<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Lid Dim Sum and Sushi</title>
<link rel="icon" href="assets/seal.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@400;500&family=Limelight&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3E6CC;--red:#D7332A;--jade:#1F7A5C;--gold:#E3A72F;--ink:#1C1A17;--card:#FBF5E6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--jade);color:var(--ink);font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--jade) url(assets/bg.webp) center/cover}
.stage::before{content:"";position:absolute;inset:0;background:rgba(28,26,23,.34);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- title ---------- */
.title{position:absolute;top:1.6vh;left:50%;transform:translateX(-50%) rotate(-1.2deg);width:min(38vw,520px);z-index:2;background:var(--red);border:5px solid var(--ink);padding:1.1vh 1.6vw .2vh;box-shadow:7px 8px 0 rgba(0,0,0,.35)}
.title span{display:block;position:relative;top:1.1em;margin:-.9em auto 0;width:max-content;background:var(--ink);color:var(--gold);font-family:Bungee,sans-serif;font-size:clamp(9px,.95vw,14px);letter-spacing:.28em;padding:.35em 1em}

/* ---------- table mat with baskets ---------- */
.mat{position:absolute;left:55%;top:57%;width:min(42.5vw,104vh,680px);transform:translate(-50%,-50%) rotate(-1.2deg);background:var(--jade);border:5px solid var(--ink);border-radius:26px;box-shadow:10px 14px 0 rgba(0,0,0,.35);padding:3.2% 3.2% 2.2%;z-index:1}
.mat::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(243,230,204,.45);border-radius:16px;pointer-events:none}
.baskets{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 2%;aspect-ratio:100/52}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12%;color:rgba(243,230,204,.85);font-family:Bungee,sans-serif;font-size:clamp(13px,1.5vw,22px);letter-spacing:.06em;pointer-events:none}
.slot{position:relative;width:var(--sw,23.5%);aspect-ratio:700/740;transform-origin:50% 92%}
.minus{position:absolute;left:0;top:26%;width:24%;max-width:30px;aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--paper);border:2px solid var(--paper);font-size:15px;font-weight:500;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .15s;z-index:2}
.slot:hover .minus,.minus:focus-visible{opacity:1}
@media (hover:none){.minus{opacity:1}}
.slot.closed .minus{display:none}
.qty{position:absolute;right:0;top:20%;padding:.05em .45em;border-radius:99px;background:var(--gold);border:2.5px solid var(--ink);font-family:Bungee,sans-serif;font-size:clamp(10px,1.15vw,17px);pointer-events:none;display:none;z-index:2}
.qty.show{display:block}
.slot.skipped .bk,.slot.skipped .front{opacity:.38}
.slot.gone{visibility:hidden}
.slot .bk{width:100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
.slot .food{position:absolute;left:50.7%;top:34.5%;width:58.6%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.slot .front{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.slot.closed .food,.slot.closed .front{display:none}
.slot .num{position:absolute;left:50.7%;top:37%;transform:translate(-50%,-50%);width:17%;aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--paper);font-family:Bungee,sans-serif;font-size:clamp(10px,1.15vw,17px);display:grid;place-items:center;pointer-events:none}
.slot.filled .num{display:none}
.slot.tray .food{left:33.7%;top:60.1%;width:42.9%}
.slot.tray .num{left:36.3%;top:58%}
.slot.tea .bk{width:64%;margin:2% auto 0}
.slot.tea .qty{top:6%;right:6%}.slot.tea .minus{top:10%;left:6%}
.slot.tea .num{left:50%;top:24%}
.slot.active{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 16px var(--gold))}}

/* ---------- lazy susan ---------- */
.susan{position:absolute;left:1.2vw;bottom:21vh;width:min(34vw,540px);aspect-ratio:1000/513;z-index:2}
.susan>img{width:100%;filter:drop-shadow(0 16px 10px rgba(0,0,0,.4))}
.sheen{position:absolute;left:1%;top:0;width:98%;height:79%;border-radius:50%;pointer-events:none;opacity:0;mix-blend-mode:soft-light;background:conic-gradient(from var(--a,0deg),transparent 0 30deg,#fff 55deg,transparent 80deg 150deg,#fff 175deg,transparent 200deg 270deg,#fff 295deg,transparent 320deg)}
.dish{position:absolute;width:30%;margin:-15% 0 0 -15%;display:flex;flex-direction:column;align-items:center}
.dish.up{flex-direction:column-reverse}
.dish.tall img{width:72%}
.dish img{width:100%;transition:transform .18s;filter:drop-shadow(0 7px 5px rgba(0,0,0,.4))}
.dish:hover,.dish:focus-visible{outline:0}
.dish:hover img,.dish:focus-visible img{transform:translateY(-7%) scale(1.08)}
.dish:focus-visible .tag{outline:3px solid var(--gold)}
.dish.chosen img{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 7px 5px rgba(0,0,0,.4))}
.tag{display:block;flex:none;margin:-9% 0 0;width:max-content;max-width:150%;position:relative;z-index:5;transform:rotate(-3deg);background:var(--card);border:2px solid var(--ink);padding:.25em .6em;font-size:clamp(9px,.82vw,12.5px);font-weight:500;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.tag b{color:var(--red)}
.hint{position:absolute;left:50%;top:-20%;transform:translateX(-50%);background:var(--red);color:var(--paper);font-family:Bungee,sans-serif;font-size:clamp(10px,.95vw,14px);padding:.3em .7em;border:2.5px solid var(--ink);box-shadow:2px 3px 0 rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;z-index:6;animation:hint 1s ease-in-out infinite}
.hint::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink)}
@keyframes hint{50%{transform:translateX(-50%) translateY(-8px)}}
.cnt{display:none;font-style:normal;margin-left:.5em;background:var(--red);color:var(--paper);border-radius:99px;padding:0 .5em;font-weight:500}
.cnt.show{display:inline-block}
.dish:nth-child(odd) .tag{transform:rotate(2.5deg)}
.dish.up .tag{margin:0 0 -7%}

/* ---------- step sign ---------- */
.sign{position:absolute;left:2vw;bottom:2.4vh;z-index:4;background:var(--gold);border:4px solid var(--ink);padding:.7em 1em .8em;transform:rotate(-1.5deg);box-shadow:5px 6px 0 rgba(0,0,0,.4);text-align:center;width:min(33vw,460px)}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:.55em}
.cat{font-family:Bungee,sans-serif;font-size:clamp(11px,1vw,14.5px);padding:.32em .7em;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.cat:hover,.cat:focus-visible{background:var(--ink);color:var(--gold);outline:0}
.cat.on{background:var(--red);color:var(--paper)}
.sign::before,.sign::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.sign::before{left:7px}.sign::after{right:7px}
.sign small{display:block;font-size:11px;letter-spacing:.25em}
.sign strong{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:clamp(17px,1.7vw,25px);line-height:1.15;text-transform:uppercase}
.sign em{display:block;font-style:normal;font-size:11px;margin-top:.2em;opacity:.85}
.skip{display:block;margin:.55em auto 0;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--gold);padding:.4em 1em}
.skip:hover,.skip:focus-visible{background:var(--red);color:var(--paper);outline:0}

/* ---------- bill ---------- */
.bill{position:absolute;right:2.2vw;top:52%;transform:translateY(-50%) rotate(1.8deg);width:min(20vw,285px);background:var(--card);padding:1.3em 1.2em 1.2em;z-index:3;box-shadow:8px 10px 0 rgba(0,0,0,.35);font-size:clamp(10.5px,.86vw,13px);
  --z:8px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--z)),96% 100%,92% calc(100% - var(--z)),88% 100%,84% calc(100% - var(--z)),80% 100%,76% calc(100% - var(--z)),72% 100%,68% calc(100% - var(--z)),64% 100%,60% calc(100% - var(--z)),56% 100%,52% calc(100% - var(--z)),48% 100%,44% calc(100% - var(--z)),40% 100%,36% calc(100% - var(--z)),32% 100%,28% calc(100% - var(--z)),24% 100%,20% calc(100% - var(--z)),16% 100%,12% calc(100% - var(--z)),8% 100%,4% calc(100% - var(--z)),0 100%)}
.bill-wrap{display:contents}
.bill .logo{width:74%;margin:0 auto .3em}
.bill h2{font-family:Bungee,sans-serif;font-weight:400;font-size:.82em;letter-spacing:.2em;text-align:center;border-bottom:2px dashed var(--ink);padding-bottom:.8em;margin-bottom:.7em}
.bill li{display:flex;align-items:baseline;gap:.5em;padding:.34em 0;position:relative;list-style:none;color:rgba(28,26,23,.45)}
.bill li.on{color:var(--ink)}
.bill li.none{color:rgba(28,26,23,.55);padding:1.2em 0;justify-content:center;text-align:center}
#lines{max-height:40vh;overflow:auto}
.step{display:inline-flex;align-items:center;gap:.4em}.step b{min-width:1em;text-align:center;font-weight:500}
.step button{width:1.55em;height:1.55em;border:1.5px solid var(--ink);background:#fff;line-height:1;font-weight:500}
.step button:hover{background:var(--gold)}
.bill li .p{min-width:2.4em;text-align:right}
.bill li.sk .n{text-decoration:line-through}
.bill li.sk .p{font-size:.85em}
.bill li i{flex:1;border-bottom:1.5px dotted currentColor;opacity:.5;transform:translateY(-.25em)}
.bill li .stamp{position:absolute;right:2.6em;top:50%;width:1.9em;transform:translateY(-50%) rotate(-12deg);opacity:.9;mix-blend-mode:multiply}
.bill .total{display:flex;justify-content:space-between;border-top:2px dashed var(--ink);margin-top:.6em;padding-top:.75em;font-weight:500;font-size:1.12em}
.pack{display:block;width:100%;margin-top:.9em;padding:.8em;border:2.5px solid var(--ink);font-family:Bungee,sans-serif;font-size:1.02em;letter-spacing:.06em;background:transparent;color:rgba(28,26,23,.4);border-color:rgba(28,26,23,.3);transition:.2s}
.pack.ready{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:3px 4px 0 var(--ink);animation:wig 1.6s ease-in-out infinite}
.pack.ready:hover{background:var(--red);color:var(--paper)}
@keyframes wig{50%{transform:rotate(-1.2deg) scale(1.02)}}
.billbar{display:none}

/* ---------- flying dish, steam, hand ---------- */
.fly{position:fixed;z-index:30;pointer-events:none;filter:drop-shadow(0 16px 10px rgba(0,0,0,.4))}
.stream{position:fixed;inset:0;width:100%;height:100%;z-index:29;pointer-events:none;overflow:visible}
.stream path{fill:none;stroke-linecap:round;stroke-dasharray:1 1}
.puff{position:fixed;z-index:31;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);pointer-events:none;filter:blur(3px)}
.hand{position:fixed;left:0;top:0;width:clamp(180px,17vw,280px);z-index:40;pointer-events:none;display:none;transform-origin:2% 84%;filter:drop-shadow(8px 14px 8px rgba(0,0,0,.35));will-change:transform}
@media (hover:hover) and (pointer:fine){
  .stage.play,.stage.play button{cursor:none}
  .stage.play .hand{display:block}
}
.hand.carry{display:block}

/* ---------- checkout ---------- */
.veil{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(28,26,23,.55);padding:16px}
.veil.show{display:grid}
.card{width:min(430px,100%);background:var(--card);border:4px solid var(--ink);box-shadow:10px 12px 0 rgba(0,0,0,.45);padding:1.6em 1.6em 1.5em;position:relative;transform:rotate(-1deg)}
.card h3{font-family:Limelight,serif;font-weight:400;font-size:2.3em;line-height:1}
.card p.sub{margin:.5em 0 1.1em;font-size:.86em;opacity:.8}
#doneSub{padding-right:88px}
.demo{display:inline-block;background:var(--ink);color:var(--gold);font-size:.7em;letter-spacing:.16em;padding:.35em .8em;margin-bottom:.2em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.card label{display:block;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;margin:.6em 0 .3em}
.card input,.card select{width:100%;font:inherit;padding:.65em .7em;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:0}
.card input:focus,.card select:focus{outline:3px solid var(--gold)}
.card .err{color:var(--red);font-size:.78em;min-height:1.2em;margin-top:.2em}
.card .go{margin-top:.5em;background:var(--red);color:var(--paper);border:2.5px solid var(--ink);box-shadow:3px 4px 0 var(--ink);font-family:Bungee,sans-serif;padding:.75em 1.3em;font-size:1em}
.card .go:hover{background:var(--gold);color:var(--ink)}
.card .x{position:absolute;right:.7em;top:.6em;width:2em;height:2em;border:2px solid var(--ink);background:var(--gold);font-family:Bungee,sans-serif}
.card .sealbig{width:74px;position:absolute;right:1.3em;top:1.3em;transform:rotate(9deg)}
.fortune{border:2px dashed var(--ink);padding:.9em 1em;margin:1em 0 .4em;font-size:.95em;background:#fff}
.fortune small{display:block;font-size:.7em;letter-spacing:.2em;margin-bottom:.4em;color:var(--red)}
.hide{display:none!important}

/* ---------- phones and narrow screens ---------- */
@media (max-width:860px){
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:8px 0 60px}
  .title,.mat,.sign,.susan{position:relative;left:auto;right:auto;top:auto;bottom:auto;flex:none}
  .title{order:1;transform:rotate(-1.2deg);width:min(58vw,290px);border-width:3px;padding:6px 12px 0;box-shadow:4px 5px 0 rgba(0,0,0,.35);margin-bottom:10px}
  .title span{font-size:8.5px}
  .mat{order:2;width:min(95vw,47vh);transform:rotate(-.8deg);border-width:4px;border-radius:18px;box-shadow:6px 8px 0 rgba(0,0,0,.35)}
  .mat::before{inset:6px}
  .slot .num{font-size:10px}
  .sign{order:3;transform:rotate(-1deg);padding:.4em .5em .55em;width:min(96vw,430px);border-width:3px}
  .cats{gap:5px;margin-top:.35em}.cat{font-size:11px;padding:.3em .55em;border-width:2px}
  .sign small{font-size:9px}
  .susan{order:4;width:min(100vw,45vh);margin:38px 0 34px}
  .dish{width:27%;margin:-13.5% 0 0 -13.5%}
  .tag{font-size:9px;white-space:normal;text-align:center;width:112%;max-width:none;line-height:1.15;padding:.2em .3em}
  .bill-wrap{display:block;position:fixed;inset:0;z-index:45;background:rgba(28,26,23,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  .bill-wrap.open{opacity:1;pointer-events:auto}
  .bill{right:50%;top:auto;bottom:70px;transform:translateX(50%) rotate(-1deg);width:min(86vw,320px);font-size:13px}
  .bill .pack{display:none}
  .billbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:56px;z-index:46;background:var(--ink);color:var(--paper);align-items:center;gap:10px;padding:0 10px 0 14px;border-top:3px solid var(--gold)}
  .billbar .info{flex:1;text-align:left;font-size:13px;color:var(--paper)}
  .billbar .info b{font-family:Bungee,sans-serif;font-weight:400;color:var(--gold);font-size:15px;margin-right:.5em}
  .billbar .pack{width:auto;margin:0;padding:.55em .9em;font-size:13px;color:rgba(243,230,204,.4);border-color:rgba(243,230,204,.3)}
  .billbar .pack.ready{color:var(--ink);border-color:var(--paper);box-shadow:none}
}
@media (max-width:860px) and (max-height:700px){.sign em{display:none}.susan{margin:30px 0 28px}}
@media (prefers-reduced-motion:reduce){.slot.active,.pack.ready,.hint{animation:none}}
</style>
</head>
<body>
<main class="stage play" id="stage">
  <h1 class="sr">Lucky Lid Dim Sum and Sushi: build your order</h1>
  <div class="title"><img src="assets/title.svg" alt="Lucky Lid"><span>DIM SUM AND SUSHI</span></div>

  <section class="mat" aria-label="Your order"><div class="baskets" id="baskets"></div><p class="empty" id="empty">Your order lands here</p></section>

  <section class="susan" aria-label="Dishes to choose from"><img src="assets/susan.webp" alt=""><div class="sheen" id="sheen"></div><div id="dishes"></div></section>

  <nav class="sign" aria-label="Menu sections"><small>TAP A DISH TO ADD IT</small><div class="cats" id="cats"></div></nav>

  <div class="bill-wrap" id="billWrap">
    <aside class="bill" aria-label="Your bill">
      <img class="logo" src="assets/title-ink.svg" alt="Lucky Lid">
      <h2>TABLE CARD</h2>
      <ul id="lines"></ul>
      <div class="total"><span>TOTAL</span><span id="total">$0</span></div>
      <button class="pack" data-pack disabled>PACK MY ORDER</button>
    </aside>
  </div>
  <div class="billbar">
    <button class="info" id="barInfo" aria-label="Show bill"><b id="barCount">0 items</b><span id="barTotal">$0</span> · view bill</button>
    <button class="pack" data-pack disabled>PACK MY ORDER</button>
  </div>

  <img class="hand" id="hand" src="assets/hand.webp" alt="">
</main>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="coTitle">
  <form class="card" id="checkout" novalidate>
    <button type="button" class="x" id="closeCo" aria-label="Back to the table">X</button>
    <h3 id="coTitle">Where to?</h3>
    <p class="sub" id="coSub"></p>
    <p class="demo">CONCEPT SITE &middot; NO ORDER IS SENT</p>
    <div class="row2"><div><label for="who">Name</label><input id="who" autocomplete="name" placeholder="Mei Lin"><div class="err" id="whoErr" role="alert"></div></div>
    <div><label for="tel">Phone</label><input id="tel" type="tel" autocomplete="tel" placeholder="555 0142"><div class="err" id="telErr" role="alert"></div></div></div>
    <label for="addr">Delivery address</label>
    <input id="addr" autocomplete="street-address" placeholder="12 Jade Lane, Apt 8">
    <div class="err" id="addrErr" role="alert"></div>
    <label for="when">Delivery time</label>
    <select id="when"><option>As soon as possible</option><option>In 45 minutes</option><option>In 1 hour</option><option>In 2 hours</option></select>
    <div class="err"></div>
    <button class="go">PLACE ORDER</button>
  </form>
  <div class="card hide" id="done">
    <img class="sealbig" src="assets/seal.svg" alt="">
    <h3>Steaming!</h3>
    <p class="sub" id="doneSub"></p>
    <div class="fortune"><small>YOUR FORTUNE</small><span id="fortune"></span></div>
    <p class="demo">CONCEPT SITE &middot; NOTHING WAS ORDERED</p>
    <button type="button" class="go" id="again">BUILD ANOTHER</button>
  </div>
</div>

<script src="assets/gsap.min.js"></script>
<script>
const CATS=[
 {name:'Dumplings',items:[['har-gow','Har Gow',8],['siu-mai','Siu Mai',7],['jade-dumpling','Jade Dumpling',7],['soup-dumpling','Soup Dumpling',9]]},
 {name:'Buns',items:[['char-siu-bao','Char Siu Bao',7],['custard-bun','Lava Custard Bun',7],['black-sesame-bun','Black Sesame Bun',6],['pan-fried-bun','Pan-Fried Bun',8]]},
 {name:'Rolls',items:[['cheung-fun','Cheung Fun',8],['spring-rolls','Spring Rolls',6],['lotus-rice','Lotus Leaf Rice',9],['turnip-cake','Turnip Cake',7]]},
 {name:'Greens',items:[['gai-lan','Gai Lan',6],['bok-choy','Garlic Bok Choy',6],['smashed-cucumber','Smashed Cucumber',5],['wood-ear','Wood Ear Salad',6]]},
 {name:'Sushi',kind:'tray',items:[['salmon-nigiri','Salmon Nigiri',9],['california-roll','California Roll',8],['tuna-maki','Tuna Maki',8],['cucumber-maki','Cucumber Maki',6]]},
 {name:'Sweets',items:[['egg-tart','Egg Tart',6],['sesame-balls','Sesame Balls',6],['mango-pudding','Mango Pudding',6],['osmanthus-jelly','Osmanthus Jelly',5]]},
 {name:'Tea',kind:'cup',items:[['jasmine','Jasmine Pearl',4],['pu-erh','Aged Pu-erh',5],['oolong','Iron Goddess Oolong',4],['chrysanthemum','Chrysanthemum',4]]}
];
const ITEMS={}; CATS.forEach((c,ci)=>c.items.forEach(([id,name,price])=>ITEMS[id]={id,name,price,ci,kind:c.kind||'box'}));
const TEA_COLOR={jasmine:'#C2C862','pu-erh':'#62261A',oolong:'#CC842A',chrysanthemum:'#EACB52'};
const FIT={box:[.586,.507,.345],tray:[.429,.337,.601]}; // food width, centre x, centre y inside the container image
const FORTUNES=['A full box is a short-lived thing. Order twice.','The lid you lift today reveals the lunch of tomorrow.','Good tea forgives a late delivery.','He who shares the last dumpling gains a friend for life.','Steam rises, and so will your afternoon.','Luck favours the one who orders the egg tarts.'];
const ANG=[292,200,22,112]; // turntable positions, back to front
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const G=window.gsap, mobile=()=>matchMedia('(max-width:860px)').matches;
const state={cat:0,cart:[],busy:false,packed:false,flying:0}; // cart: [{id,qty}] in the order things were added
const hand=$('#hand'), table=$('#baskets'); let auto=null, seen=false;
const img=id=>`assets/${id}.webp`;
const dishImg=id=>img((ITEMS[id].kind==='cup'?'tea-':'')+id); // porcelain cup on the turntable, paper cup on the table
const entry=id=>state.cart.find(e=>e.id===id), slotOf=id=>table.querySelector(`[data-id="${id}"]`);
const count=()=>state.cart.reduce((n,e)=>n+e.qty,0), total=()=>state.cart.reduce((n,e)=>n+e.qty*ITEMS[e.id].price,0);
Object.keys(ITEMS).forEach(id=>{new Image().src=dishImg(id)});
['box-open','box-front','box-closed','tray-open','tray-front','tray-closed','cup-open','cup-closed'].concat(CATS[6].items.map(t=>t[0])).forEach(n=>{new Image().src=img(n)});

/* ---- menu sections + turntable ---- */
$('#cats').innerHTML=CATS.map((c,i)=>`<button class="cat" data-c="${i}">${c.name}</button>`).join('');
function spot(k,a){const m=mobile(),t=(ANG[k]+a)*Math.PI/180; return [50+(m?32:34)*Math.cos(t),(m?31:33)+(m?25:30)*Math.sin(t)];}
function place(a,sc){$$('.dish').forEach((el,k)=>{const [x,y]=spot(k,a); el.style.left=x+'%'; el.style.top=y+'%'; if(G&&sc!=null) G.set(el,{scale:sc,opacity:Math.min(1,sc*1.5)});});}
let spinTl=null;
function renderDishes(animate){
  const box=$('#dishes'), c=CATS[state.cat];
  $$('.cat').forEach((b,i)=>{b.classList.toggle('on',i===state.cat); b.setAttribute('aria-pressed',i===state.cat);});
  const draw=()=>{box.innerHTML=c.items.map(([id,name,price],k)=>`<button class="dish${k<2?' up':''}" data-id="${id}" aria-label="Add ${name}, ${price} dollars"><img src="${dishImg(id)}" alt=""><span class="tag">${name} <b>$${price}</b><i class="cnt"></i></span></button>`).join(''); place(0,null); renderCounts();
    if(!state.hinted) box.children[2]?.insertAdjacentHTML('beforeend','<span class="hint">Tap to add</span>');}; // shown until the first dish is added
  if(spinTl){spinTl.kill();spinTl=null;}
  if(!(G&&animate)){draw();return;}
  const o={a:0}, sheen=$('#sheen'), sh={v:0};
  spinTl=G.timeline({onComplete(){G.set('.dish',{clearProps:'transform,opacity'});spinTl=null;}});
  if(box.children.length) spinTl.to(o,{a:160,duration:.36,ease:'power2.in',onUpdate(){place(o.a,1-o.a/160*.88)}});
  spinTl.add(()=>{draw();o.a=-160;place(-160,.12);})
        .to(o,{a:0,duration:.6,ease:'power3.out',onUpdate(){place(o.a,1+o.a/160*.88)}});
  G.fromTo(sh,{v:0},{v:420,duration:1,ease:'power2.out',onUpdate(){sheen.style.setProperty('--a',sh.v+'deg');sheen.style.opacity=Math.sin(Math.PI*this.progress())*.9;}});
}
function renderCounts(){ $$('.dish').forEach(d=>{const e=entry(d.dataset.id), c=d.querySelector('.cnt'); c.textContent=e?e.qty:''; c.classList.toggle('show',!!e);}); }

/* ---- table: one container per different dish, with a quantity badge ---- */
function layout(){
  const n=state.cart.length;
  table.style.setProperty('--sw',n<=3?'30%':n<=8?'23.5%':n<=12?'15.2%':'11%'); // containers shrink as the table fills
  $('#empty').classList.toggle('hide',n>0);
}
function addSlot(it){
  const el=document.createElement('div'); el.className='slot '+(it.kind==='cup'?'tea':it.kind); el.dataset.id=it.id;
  el.innerHTML=`<img class="bk" src="${img(it.kind+'-open')}" alt="">${it.kind==='cup'?'':`<img class="front" src="${img(it.kind+'-front')}" alt="">`}<button class="minus" aria-label="Remove one ${it.name}">&minus;</button><span class="qty"></span>`;
  table.append(el); layout(); return el;
}
function fill(el,it){
  if(it.kind==='cup') el.querySelector('.bk').src=img(it.id);
  else if(!el.querySelector('.food')){const f=new Image(); f.src=img(it.id); f.className='food'; f.alt=''; el.insertBefore(f,el.querySelector('.front'));}
}
function renderSlot(id){const el=slotOf(id), e=entry(id); if(!el||!e) return; const q=el.querySelector('.qty'); q.textContent='×'+e.qty; q.classList.toggle('show',e.qty>1);}
function renderBill(){
  const ul=$('#lines');
  const rows=state.cart.filter(e=>e.qty>0);
  ul.innerHTML=rows.length?rows.map(e=>{const it=ITEMS[e.id]; return `<li class="on"><span class="n">${it.name}</span><i></i><span class="step"><button data-d="-1" data-id="${it.id}" aria-label="One less ${it.name}">&minus;</button><b>${e.qty}</b><button data-d="1" data-id="${it.id}" aria-label="One more ${it.name}">+</button></span><span class="p">$${it.price*e.qty}</span></li>`;}).join(''):'<li class="none">Nothing yet. Tap a dish to add it.</li>';
  const n=count(), t=total();
  $('#total').textContent='$'+t; $('#barTotal').textContent='$'+t; $('#barCount').textContent=n+(n===1?' item':' items');
  $$('[data-pack]').forEach(b=>{b.disabled=!n; b.classList.toggle('ready',n>0)});
  return t;
}
function refresh(id){renderSlot(id); renderBill(); renderCounts();}
function bump(el){G&&G.fromTo(el,{scale:.9},{scale:1,duration:.45,ease:'elastic.out(1,.45)',clearProps:'transform'});}
function puff(x,y){
  if(!G) return;
  for(let k=0;k<5;k++){const d=document.createElement('div'); d.className='puff'; d.style.left=x-13+'px'; d.style.top=y-13+'px'; document.body.append(d);
    G.fromTo(d,{scale:.4,opacity:.9},{x:(k-2)*22+(Math.random()*16-8),y:-70-Math.random()*50,scale:2.2,opacity:0,duration:.9+Math.random()*.4,ease:'power1.out',onComplete:()=>d.remove()});}
}
// change a quantity from the bill or the minus button on a container (no chopsticks)
function change(id,d){
  if(state.busy||state.packed) return;
  const e=entry(id); if(!e) return;
  e.qty+=d;
  if(e.qty<=0){
    state.cart.splice(state.cart.indexOf(e),1); const el=slotOf(id);
    const gone=()=>{el.remove(); layout();};
    if(G) G.to(el,{scale:0,opacity:0,duration:.22,ease:'power2.in',onComplete:gone}); else gone();
    renderBill(); renderCounts(); return;
  }
  refresh(id); bump(slotOf(id));
}
// add one of a dish: the chopsticks carry it from the turntable to its container
function add(id,btn){
  if(state.packed) return;
  if(!state.hinted){state.hinted=true; $$('.hint').forEach(h=>h.remove());}
  const it=ITEMS[id]; let e=entry(id), el=slotOf(id); const fresh=!e;
  if(fresh){e={id,qty:0}; state.cart.push(e); el=addSlot(it);}
  const landed=()=>{
    state.flying--;
    if(!entry(id)){e={id,qty:0}; state.cart.push(e);}          // it was removed while the dish was in the air
    if(!el.isConnected) el=slotOf(id)||addSlot(it);
    e.qty++; fill(el,it); refresh(id); const r=el.getBoundingClientRect(); puff(r.left+r.width/2,r.top+r.height*.3); bump(el);
  };
  state.flying++;
  if(!G) return landed();
  hand.classList.add('carry');
  const src=btn.querySelector('img'), a=src.getBoundingClientRect(), t=el.getBoundingClientRect(), cr=el.querySelector('.bk').getBoundingClientRect();
  if(fresh) G.from(el,{scale:.4,opacity:0,duration:.3,ease:'back.out(1.7)',clearProps:'transform,opacity'});
  const cup=it.kind==='cup', fit=FIT[it.kind]||FIT.box, w=cup?cr.width*.95:t.width*fit[0], tx=cup?cr.left+cr.width*.5:t.left+t.width*fit[1]-w/2, ty=cup?cr.top-w*1.02:t.top+t.height*fit[2]-w/2;
  const f=src.cloneNode(); f.className='fly'; Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px'}); document.body.append(f);
  const lift=Math.min(a.top,ty)-90-a.top;
  const grip=()=>{const r=f.getBoundingClientRect(); auto={x:r.left+r.width/2,y:r.top+r.height*.5};};
  if(!seen){hx=innerWidth+60;hy=a.top;} grip();
  const d=seen?.1:.25, T=fresh?.75:.45; // a dish already on the table travels faster
  const tl=G.timeline({onUpdate:grip,onComplete(){f.remove();landed();
      if(state.flying) return;                                   // other dishes are still in the air
      auto=null; if(!seen){mx=innerWidth+420;my=innerHeight*.3;setTimeout(()=>{if(!auto)hand.classList.remove('carry')},450);}else hand.classList.remove('carry');}})
   .to(f,{scale:1.12,duration:d,ease:'power2.out'},0)
   .to(f,{x:tx-a.left,width:w,scale:1,duration:T,ease:'power1.inOut'},d)
   .to(f,{y:lift,duration:T/2,ease:'power2.out'},d)
   .to(f,{y:ty-a.top,duration:T/2,ease:'power2.in'},d+T/2)
   .to(f,{rotation:-8,duration:T/2,yoyo:true,repeat:1,ease:'sine.inOut'},d);
  if(cup&&!fresh) tl.to(f,{y:'+='+w*.6,scale:.5,opacity:0,duration:.2,ease:'power2.in'},d+T); // another of the same tea: drop it in, no pour
  if(cup&&fresh){ // first cup of this tea: tip the porcelain cup and pour a stream into the paper cup
    let svg, paths;
    tl.to(f,{rotation:-58,x:'-='+cr.width*.2,y:'+='+w*.12,duration:.3,ease:'power2.inOut',transformOrigin:'30% 60%'},d+.78)
      .add(()=>{
        const r=f.getBoundingClientRect(), x0=r.left+r.width*.3, y0=r.top+r.height*.7, x1=cr.left+cr.width*.5, y1=cr.top+cr.height*.2, sw=Math.max(4,cr.width*.075);
        svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','stream');
        const dd=`M${x0},${y0} Q${x0-sw*.6},${(y0+y1)/2} ${x1},${y1}`;
        svg.innerHTML=`<path pathLength="1" d="${dd}" stroke="${TEA_COLOR[id]}" stroke-width="${sw}"/><path pathLength="1" d="${dd}" stroke="#fff" stroke-opacity=".4" stroke-width="${sw*.28}" transform="translate(${-sw*.18},0)"/>`;
        document.body.append(svg); paths=svg.querySelectorAll('path');
        G.fromTo(paths,{strokeDashoffset:1},{strokeDashoffset:0,duration:.16,ease:'power1.in'});
      },d+1.04)
      .add(()=>{fill(el,it);puff(cr.left+cr.width/2,cr.top+cr.height*.12);},d+1.22)
      .add(()=>{G.to(paths,{strokeDashoffset:-1,duration:.2,ease:'power1.in',onComplete:()=>svg.remove()});},d+1.55)
      .to(f,{opacity:0,rotation:-20,y:'-='+w*.3,duration:.3,ease:'power1.in'},d+1.72);
  }
}
function setCat(i){ if(state.packed||i===state.cat) return; state.cat=i; renderDishes(true); }

/* ---- pack and checkout ---- */
function pack(){
  if(!count()||state.busy||state.flying) return;
  state.busy=true; state.packed=true; $('#billWrap').classList.remove('open'); $('#stage').classList.remove('play');
  const slots=$$('.slot'), gap=Math.min(.14,1/slots.length);
  slots.forEach((el,i)=>{
    const k=ITEMS[el.dataset.id].kind;
    const close=()=>{el.querySelector('.bk').src=img(k+'-closed'); el.classList.add('closed');
      const r=el.getBoundingClientRect(); puff(r.left+r.width/2,r.top+r.height*.3);
      G&&G.fromTo(el,{scaleY:.84,scaleX:1.07},{scaleY:1,scaleX:1,duration:.55,ease:'elastic.out(1,.4)',clearProps:'transform'});};
    if(!G) return close();
    const f=el.querySelector('.food'), tl=G.timeline({delay:i*gap});
    if(f) tl.to(f,k==='tray'?{x:el.offsetWidth*.2,y:-el.offsetWidth*.21,opacity:0,duration:.32,ease:'power2.in'}:{yPercent:24,scale:.7,duration:.22,ease:'power2.in'});
    tl.add(close);
  });
  setTimeout(openCheckout,G?900+slots.length*gap*1000:200);
}
function openCheckout(){
  const t=renderBill(), got=k=>state.cart.reduce((n,e)=>n+(ITEMS[e.id].kind===k?e.qty:0),0), parts=[], pl=(n,one,many)=>n===1?one:n+' '+many;
  if(got('box')) parts.push(pl(got('box'),'one box','boxes')); if(got('tray')) parts.push(pl(got('tray'),'one sushi box','sushi boxes')); if(got('cup')) parts.push(pl(got('cup'),'one tea','teas'));
  const what=parts.length>1?parts.slice(0,-1).join(', ')+' and '+parts.at(-1):parts[0];
  $('#coSub').textContent=`${what[0].toUpperCase()+what.slice(1)} · delivery included · $${t}`;
  $('#checkout').classList.remove('hide'); $('#done').classList.add('hide'); $('#veil').classList.add('show');
  G&&G.from('#checkout',{y:60,opacity:0,duration:.4,ease:'back.out(1.6)'}); $('#who').focus(); state.busy=false;
}
function unpack(){
  $$('.slot').forEach(el=>{const it=ITEMS[el.dataset.id]; el.classList.remove('closed'); el.querySelector('.bk').src=img(it.kind==='cup'?it.id:it.kind+'-open'); const f=el.querySelector('.food'); f&&G&&G.set(f,{clearProps:'transform,opacity'});});
  state.packed=false; $('#veil').classList.remove('show'); $('#stage').classList.add('play');
}
function reset(){ unpack(); state.cart=[]; table.innerHTML=''; layout(); ['who','tel','addr'].forEach(k=>$('#'+k).value=''); renderBill(); state.cat=0; renderDishes(true); }

/* ---- events ---- */
$('#dishes').addEventListener('click',e=>{const b=e.target.closest('.dish'); if(b) add(b.dataset.id,b);});
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat'); if(b) setCat(+b.dataset.c);});
table.addEventListener('click',e=>{const m=e.target.closest('.minus'), s=e.target.closest('.slot'); if(m) change(s.dataset.id,-1); else if(s) setCat(ITEMS[s.dataset.id].ci);});
$('#lines').addEventListener('click',e=>{const b=e.target.closest('button[data-d]'); if(b) change(b.dataset.id,+b.dataset.d);});
$$('[data-pack]').forEach(b=>b.addEventListener('click',pack));
$('#barInfo').addEventListener('click',()=>$('#billWrap').classList.toggle('open'));
$('#billWrap').addEventListener('click',e=>{if(e.target.id==='billWrap') e.currentTarget.classList.remove('open');});
$('#closeCo').addEventListener('click',unpack);
['who','tel','addr'].forEach(k=>$('#'+k).addEventListener('input',()=>$('#'+k+'Err').textContent=''));
$('#checkout').addEventListener('submit',e=>{e.preventDefault();
  const v=k=>$('#'+k).value.trim(), bad=[];
  const check=(k,ok,msg)=>{$('#'+k+'Err').textContent=ok?'':msg; if(!ok) bad.push(k);};
  check('who',v('who').length>1,'Enter your name.');
  check('tel',v('tel').replace(/\D/g,'').length>=6,'Enter a phone number.');
  check('addr',v('addr').length>4,'Enter a delivery address.');
  if(bad.length){ $('#'+bad[0]).focus(); return; }
  $('#doneSub').textContent=`Thanks, ${v('who')}. Heading to ${v('addr')}, ${$('#when').value.toLowerCase()}.`;
  $('#fortune').textContent=FORTUNES[Math.floor(Math.random()*FORTUNES.length)];
  $('#checkout').classList.add('hide'); $('#done').classList.remove('hide'); G&&G.from('#done',{scale:.8,rotation:-6,opacity:0,duration:.45,ease:'back.out(1.8)'});
});
$('#again').addEventListener('click',reset);
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#veil').classList.contains('show')&&!$('#checkout').classList.contains('hide')) unpack();});

/* ---- chopsticks cursor (mouse only) ---- */
let hx=innerWidth*.6,hy=innerHeight*.5,mx=hx,my=hy,down=0;
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){mx=e.clientX;my=e.clientY;if(!seen){seen=true;hx=mx;hy=my;}}});
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')down=1}); addEventListener('pointerup',()=>down=0);
(function loop(){const tx=auto?auto.x:mx,ty=auto?auto.y:my,k=auto?.42:.28; hx+=(tx-hx)*k;hy+=(ty-hy)*k;const w=hand.offsetWidth,h=hand.offsetHeight;
  if(w) hand.style.transform=`translate(${hx-w*.02}px,${hy-h*.84}px) rotate(${auto||down?-8:(mx-hx)*.04}deg)`;requestAnimationFrame(loop);})();

addEventListener('resize',()=>{if(!spinTl)place(0,null);});
layout(); renderDishes(true); renderBill();
</script>
</body>
</html>
